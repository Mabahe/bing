name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  kahlan:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4", "8.5"]
        symfony: ["^7.0", "^8.0"]
        guzzle: ["^7.8", "^8.0"]
        exclude:
          # Symfony 8 requires PHP >= 8.4
          - php: "8.2"
            symfony: "^8.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Pin dependency versions of this matrix entry
        run: |
          composer require --no-update --no-interaction \
            "symfony/dom-crawler:${{ matrix.symfony }}" \
            "symfony/css-selector:${{ matrix.symfony }}" \
            "guzzlehttp/guzzle:${{ matrix.guzzle }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E "^(guzzlehttp/guzzle|symfony/dom-crawler|symfony/css-selector|kahlan/kahlan) "

      # Offline specs only (fixtures, no network). The live specs in spec-live/
      # talk to bing.com and are meant to be run by hand.
      - name: Run Kahlan specs
        run: vendor/bin/kahlan --reporter=verbose
